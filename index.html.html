<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Conscious Kain – Mid-Fidelity Prototype</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16202a;--mut:#64707d;--line:#dde4e0;--acc:#1f3a5f;--onacc:#fff;--ok:#2e7d32;--okbg:#e3f1e4;--warn:#b45309;--ph:#eaf1ec;--g1:#1f3a5f;--g2:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1411;--card:#16201a;--ink:#e8efe9;--mut:#9aa9a0;--line:#26332b;--acc:#8db4e6;--onacc:#0e1411;--ok:#7bd28a;--okbg:#16301b;--warn:#f0b35a;--ph:#1d2b22;--g1:#1b3556;--g2:#23602a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1411;--card:#16201a;--ink:#e8efe9;--mut:#9aa9a0;--line:#26332b;--acc:#8db4e6;--onacc:#0e1411;--ok:#7bd28a;--okbg:#16301b;--warn:#f0b35a;--ph:#1d2b22;--g1:#1b3556;--g2:#23602a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100%;padding:0 16px 96px}
h1{font-size:22px;margin:14px 0 2px;letter-spacing:-.3px}h2{font-size:16px;margin:20px 0 8px}p{margin:3px 0}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px}.brand{font-weight:800;font-size:16px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:20px;padding:20px;margin:8px 0}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{opacity:.92;font-size:14px}.hero .st{display:flex;gap:8px;margin-top:14px}
.hero .st div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px;text-align:center;font-size:11px}.hero .st b{display:block;font-size:15px}
.tile{width:78px;height:78px;border-radius:14px;background:linear-gradient(135deg,var(--ph),var(--okbg));display:flex;align-items:center;justify-content:center;font-size:38px;flex:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;background:var(--acc);color:var(--onacc);cursor:pointer}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}.btn.red{background:transparent;color:#c0392b;border:1.5px solid #c0392b}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:20px;cursor:pointer;flex:none}
.badge{background:var(--okbg);color:var(--ok);font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}.tag{background:var(--ph);color:var(--mut);font-size:11px;border-radius:6px;padding:2px 7px}
.tag.w{color:var(--warn)}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font-size:15px;margin-top:10px}
.mac{margin:8px 0}.mac i{display:block;height:8px;border-radius:5px;background:var(--ph);overflow:hidden}.mac i b{display:block;height:100%;background:var(--ok)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);box-sizing:border-box;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;cursor:pointer;padding:4px}nav button span{display:block;font-size:19px}nav button.on{color:var(--acc);font-weight:700}
.back{background:none;border:0;color:var(--acc);font-size:14px;padding:6px 0;cursor:pointer}
.step{display:flex;gap:12px;align-items:center;margin:12px 0;color:var(--mut)}.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}.dot.done{background:var(--ok);border-color:var(--ok)}.step.cur{color:var(--ink);font-weight:700}.step.cur .dot{border-color:var(--ok)}
.toast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1c2630;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:9;width:max-content;max-width:90%}
.toast button{background:none;border:0;color:#9fd0ff;font-weight:700;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:min(430px,100%);box-sizing:border-box;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 8px}.sheet b{color:var(--acc)}.sheet p{margin:8px 0}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cm{height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}.msg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:14px}.msg.r{background:var(--ph)}.msg.u{background:var(--acc);color:var(--onacc)}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="ov"></div>
<script>
const M=[
{n:'Grilled Chicken & Brown Rice Bowl',v:'Kain Kitchen',e:'🍗',k:420,p:32,c:45,f:9,$:135,t:'hp',m:25,i:'Chicken breast, brown rice, broccoli, carrots, olive oil',w:'Lean protein with slow-release carbs keeps you full through the afternoon.'},
{n:'Tofu Veggie Stir-fry with Red Rice',v:'Green Plate',e:'🥦',k:380,p:18,c:52,f:10,$:110,t:'veg',m:20,i:'Tofu, red rice, bok choy, mushrooms, garlic, soy sauce',w:'Plant protein and fibre-rich red rice at a budget-friendly price.'},
{n:'Tuna Salad Wrap',v:'Fit Pinoy Eats',e:'🌯',k:350,p:24,c:38,f:11,$:120,t:'hp',m:15,i:'Whole-wheat wrap, tuna, lettuce, tomato, light yogurt dressing',w:'Quick, portable and high in protein for desk lunches.'},
{n:'Sinigang na Isda with Quinoa',v:'Kain Kitchen',e:'🍲',k:400,p:30,c:42,f:8,$:145,t:'hp',m:25,i:'Fish, quinoa, kangkong, radish, tamarind broth',w:'A familiar Filipino comfort dish, rebuilt with quinoa and less oil.'},
{n:'Salmon & Quinoa Bowl',v:'Green Plate',e:'🐟',k:450,p:34,c:40,f:16,$:175,t:'hp',m:30,so:1,i:'Salmon, quinoa, cucumber, edamame, sesame',w:'Omega-3 rich and filling.'}];
const PL=[{n:'Lite',m:3,$:360},{n:'Weekday',m:5,$:575}],D=['Mon','Tue','Wed','Thu','Fri'];
const N={home:['Anna is short on time and can’t tell which meals are truly healthy.','Side menu or dashboard home: rejected, it adds taps for a rushed user.','Smaller menu than general apps, but every item is trustworthy.'],
detail:['Respondents can’t tell if a meal is nutritious.','A simple “healthy” label: rejected, claims alone are not believable.','Vendors must supply full nutrition data before listing.'],
plans:['100% of respondents lack time to cook; they want fewer daily decisions.','Pay-per-meal only: kept as the default path; plans are optional.','Recurring revenue, so pause and cancel must be easy to protect trust.'],
cart:['Cost pressure: no surprise fees, and familiar local payment options (GCash, Maya, cash on delivery).','Reveal fees at payment: rejected, it erodes trust.','Showing the total early may reduce impulse upsells, but improves completion.'],
orders:['Customers need to know when food arrives and to fix mistakes.','Non-cancellable orders: rejected, too risky for the customer.','A short cancel window limits vendor waste; in-app chat lets customers fix delivery issues without calling.']};
const S={s:'home',sel:0,f:'all',q:'',sz:'Regular',cart:[],plan:null,ord:null,slot:'6:00–7:00 PM',cc:0,und:null,addr:null,chat:[],co:0,pay:null};let T,TT;
const $=x=>'₱'+x,up=i=>M[i.id].$+(i.sz=='Large'?30:0),ft=()=>S.cart.reduce((a,i)=>a+up(i)*i.q,0)+(S.plan&&!S.plan.on?PL[S.plan.i].$:0);
function tst(m,u){S.und=u||null;clearTimeout(TT);document.getElementById('ov').innerHTML=`<div class="toast">${m}${u?'<button onclick="undo()">Undo</button>':''}</div>`;TT=setTimeout(()=>document.getElementById('ov').innerHTML='',4000)}
function go(s,id){if(id!==undefined)S.sel=id;S.s=s;S.cc=0;document.getElementById('ov').innerHTML='';draw();window.scrollTo(0,0)}
function add(id,sz){const x=S.cart.find(c=>c.id==id&&c.sz==(sz||'Regular'));x?x.q++:S.cart.push({id,sz:sz||'Regular',q:1});draw();tst('Added to cart · <u onclick="go(\'cart\')">View cart</u>')}
function q(i,d){S.cart[i].q+=d;if(S.cart[i].q<1)rm(i);else draw()}
function rm(i){const r=S.cart.splice(i,1)[0];draw();tst('Item removed',()=>{S.cart.splice(i,0,r);draw()})}
function undo(){if(S.und)S.und();S.und=null;document.getElementById('ov').innerHTML=''}
function notes(){const n=N[S.s];document.getElementById('ov').innerHTML=`<div class="sheet" onclick="this.remove()"><div onclick="event.stopPropagation()"><h3>Design notes</h3><p><b>User need:</b> ${n[0]}</p><p><b>Alternative considered:</b> ${n[1]}</p><p><b>Consequence:</b> ${n[2]}</p><button class="btn ghost" onclick="document.getElementById('ov').innerHTML=''">Close</button></div></div>`}
function place(){if(!S.cart.length&&!(S.plan&&!S.plan.on))return;if(!S.addr)return addr('Add your address to place the order.');if(!S.pay)return tst('Choose a payment method first');const t=ft()+29;if(S.plan)S.plan.on=true;S.ord={id:'KK-'+(1000+Math.floor(Math.random()*900)),step:0,x:0,t,slot:S.slot,it:S.cart.slice(),pay:S.pay};S.cart=[];S.chat=[{w:'r',t:'Thanks for your order! Message us here if you need to update your delivery details.'}];clearInterval(T);T=setInterval(()=>{if(S.ord&&!S.ord.x&&S.ord.step<3){S.ord.step++;if(S.ord.step==2)S.chat.push({w:'r',t:'Your rider Mark is on the way. ETA about 15 minutes.'});if(S.ord.step==3)S.chat.push({w:'r',t:'Delivered. Enjoy your meal!'});if(S.s=='orders')draw();if(S.co)chat()}else clearInterval(T)},4000);go('orders')}
const PY=[['GCash','📱'],['Maya','💳'],['Card','💳'],['Cash on delivery','💵']];
const E=s=>(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const addrCard=()=>S.addr?`<div class="card row sp"><div><b>📍 ${E(S.addr.n)}</b><p class="mut">${E(S.addr.s)}, ${E(S.addr.c)}${S.addr.l?' · '+E(S.addr.l):''}</p></div><button class="btn sm ghost" onclick="addr()">Change</button></div>`:`<div class="card"><p class="mut">Add where we should deliver your meal.</p><button class="btn" style="margin-top:8px" onclick="addr()">📍 Add delivery address</button></div>`;
function addr(m){const a=S.addr||{};document.getElementById('ov').innerHTML=`<div class="sheet" onclick="this.remove()"><div onclick="event.stopPropagation()"><h3>Delivery address</h3><input id="a1" class="search" placeholder="Full name" value="${E(a.n)}"><input id="a2" class="search" placeholder="Street, building, barangay" value="${E(a.s)}"><input id="a3" class="search" placeholder="City" value="${E(a.c)}"><input id="a4" class="search" placeholder="Landmark or note for rider (optional)" value="${E(a.l)}"><p class="mut" id="ae" style="margin:8px 0">${m||''}</p><button class="btn" onclick="saveAddr()">Save address</button></div></div>`}
function saveAddr(){const g=i=>document.getElementById(i).value.trim();if(!g('a1')||!g('a2')||!g('a3')){document.getElementById('ae').textContent='Please fill in your name, street and city.';return}S.addr={n:g('a1'),s:g('a2'),c:g('a3'),l:g('a4')};document.getElementById('ov').innerHTML='';draw();tst('Address saved')}
function chat(){S.co=1;const m=S.chat.map(x=>`<div style="display:flex;justify-content:${x.w=='u'?'flex-end':'flex-start'}"><div class="msg ${x.w}">${E(x.t)}</div></div>`).join('');document.getElementById('ov').innerHTML=`<div class="sheet" onclick="S.co=0;this.remove()"><div onclick="event.stopPropagation()"><div class="row sp"><h3>Chat · Order #${S.ord.id}</h3><button class="chip" onclick="S.co=0;document.getElementById('ov').innerHTML=''">Close</button></div><div id="cm" class="cm">${m}</div><div class="chips">${['Where is my order?','Please call on arrival','Leave at the gate'].map(x=>`<button class="chip" onclick="send('${x}')">${x}</button>`).join('')}</div><div class="row"><input id="ci" class="search" style="margin:0" placeholder="Type a message" onkeydown="if(event.key=='Enter')send()"><button class="btn sm" onclick="send()">Send</button></div></div></div>`;const c=document.getElementById('cm');c.scrollTop=c.scrollHeight}
function send(t){const i=document.getElementById('ci');t=t||i.value.trim();if(!t)return;S.chat.push({w:'u',t});setTimeout(()=>{if(!S.ord)return;S.chat.push({w:'r',t:S.ord.x?'This order has been cancelled.':/where|status/i.test(t)?['Your order is confirmed.','The vendor is preparing your meal.','Your rider is on the way.','Your order was delivered.'][S.ord.step]:'Got it, thanks! I’ve noted that for your delivery.'});if(S.co)chat()},1200);chat()}
function card(m,i){return `<div class="card" style="${m.so?'opacity:.75':''}"><div class="row" style="align-items:flex-start"><div class="tile" onclick="go('detail',${i})" style="cursor:pointer">${m.e}</div><div style="flex:1;cursor:pointer" onclick="go('detail',${i})"><b>${m.n}</b><p class="mut">${m.v} · ⏱ ${m.m} min</p><p class="mut">${m.k} kcal · ${m.p}g protein</p><div style="margin-top:4px"><span class="badge">✓ Verified</span> ${m.so?'<span class="tag w">Sold out</span>':''}</div></div></div><div class="row sp" style="margin-top:10px"><b style="font-size:17px">${$(m.$)}</b>${m.so?'<button class="btn sm ghost" onclick="go(\'detail\','+i+')">See alternatives</button>':`<button class="add" aria-label="Add" onclick="add(${i})">+</button>`}</div></div>`}
function list(){const ok=m=>(S.f=='all'||(S.f=='b'?m.$<130:m.t==S.f))&&(m.n+m.v).toLowerCase().includes(S.q.toLowerCase());const r=M.map((m,i)=>ok(m)?card(m,i):'').join('');return r||`<div class="card"><b>No meals match.</b><p class="mut">Try clearing filters, or <a href="#" onclick="S.f='all';S.q='';draw();return false">show all meals</a>.</p></div>`}
function flt(f){S.f=f;draw()}
const V={
home(){const L=[['all','All'],['b','Under ₱130'],['hp','High-protein'],['veg','Vegetarian']];return `<div class="hero"><h1>Eat well, even on busy days</h1><p>Verified-healthy meals with calories and ingredients shown before you order.</p><div class="st"><div><b>100%</b>nutrition-verified</div><div><b>~25 min</b>delivery</div><div><b>from ₱110</b>per meal</div></div></div>
<input class="search" placeholder="🔍  Search meals or vendors" value="${S.q}" oninput="S.q=this.value;document.getElementById('list').innerHTML=list()"><div class="chips">${L.map(a=>`<button class="chip ${S.f==a[0]?'on':''}" onclick="flt('${a[0]}')">${a[1]}</button>`).join('')}</div>
<div class="card row sp"><div><b>📅 Skip the daily decision</b><p class="mut">3–5 meals a week, from ₱115 each.</p></div><button class="btn sm" onclick="go('plans')">See plans</button></div><h2>Picked for you</h2><div id="list">${list()}</div>`},
detail(){const m=M[S.sel],alt=M.map((x,i)=>[x,i]).filter(a=>a[1]!=S.sel&&!a[0].so&&a[0].t==m.t).slice(0,2);return `<button class="back" onclick="go('home')">← Back to meals</button><div class="tile" style="width:100%;height:150px;font-size:70px;margin-top:6px">${m.e}</div>
<h1>${m.n}</h1><p class="mut">by ${m.v} · ⏱ ${m.m} min · <span class="badge">✓ Verified healthy</span></p><p style="margin-top:8px">${m.w}</p>
<div class="card"><b>${m.k} kcal</b>${[['Protein',m.p,40],['Carbs',m.c,70],['Fat',m.f,25]].map(a=>`<div class="mac"><div class="row sp mut"><span>${a[0]}</span><span>${a[1]}g</span></div><i><b style="width:${Math.min(100,a[1]/a[2]*100)}%"></b></i></div>`).join('')}</div>
<h2>Ingredients</h2><p>${m.i}</p>
${m.so?`<div class="card"><b>Sold out today</b><p class="mut">Similar verified meals you can order instead:</p>${alt.map(a=>`<div class="row sp" style="margin-top:8px"><span>${a[0].e} ${a[0].n}</span><button class="btn sm ghost" onclick="go('detail',${a[1]})">View</button></div>`).join('')}</div>`:
`<h2>Portion</h2><div class="row">${['Regular','Large'].map(z=>`<button class="chip ${S.sz==z?'on':''}" onclick="S.sz='${z}';draw()">${z}${z=='Large'?' (+₱30)':''}</button>`).join('')}</div><div style="margin-top:18px"><button class="btn" onclick="add(${S.sel},S.sz)">Add to cart · ${$(m.$+(S.sz=='Large'?30:0))}</button></div>`}`},
plans(){const p=S.plan;let h=`<h1>Meal plans</h1><p class="mut">Healthy meals scheduled for you. Change or cancel any time.</p>`;
if(p){const P=PL[p.i],n=p.d.filter(Boolean).length;h+=`<div class="card"><div class="row sp"><b>${P.n} plan ${p.on?(p.z?'<span class="tag w">Paused</span>':'<span class="badge">Active</span>'):'<span class="tag">In cart</span>'}</b><b>${$(P.$)}/week</b></div><p class="mut" style="margin-top:8px">Delivery days (${n} of ${P.m} chosen)</p><div class="chips">${D.map((d,j)=>`<button class="chip ${p.d[j]?'on':''}" onclick="tg(${j})">${d}</button>`).join('')}</div>
<p class="mut" style="margin-top:8px">Meal preference</p><div class="chips">${['Balanced','High-protein','Vegetarian'].map(x=>`<button class="chip ${p.f==x?'on':''}" onclick="S.plan.f='${x}';draw()">${x}</button>`).join('')}</div><div class="row" style="margin-top:12px">${p.on?`<button class="btn ghost" onclick="S.plan.z=!S.plan.z;draw();tst(S.plan.z?'Plan paused. No charges until you resume.':'Plan resumed')">${p.z?'Resume':'Pause next week'}</button><button class="btn red" onclick="S.plan=null;draw();tst('Plan cancelled')">Cancel plan</button>`:`<button class="btn" onclick="go('cart')">Go to cart</button><button class="btn ghost" onclick="S.plan=null;draw()">Remove</button>`}</div></div>`}
else h+=PL.map((x,i)=>`<div class="card"><div class="row sp"><b>${x.n} · ${x.m} meals/week</b><b>${$(x.$)}</b></div><p class="mut">${$(Math.round(x.$/x.m))} per meal · save ${$(x.m*128-x.$)} vs. ordering one by one</p><div class="chips">${D.map((d,j)=>`<span class="chip ${j<x.m?'on':''}">${d}</span>`).join('')}</div><button class="btn" style="margin-top:8px" onclick="S.plan={i:${i},d:[${D.map((d,j)=>j<x.m)}],f:'Balanced',on:false,z:false};go('plans');tst('${x.n} plan added to cart')">Choose ${x.n}</button></div>`).join('')+`<p class="mut" style="text-align:center">Prefer no commitment? <a href="#" onclick="go('home');return false">Order meal by meal</a></p>`;return h},
cart(){const t=ft(),pl=S.plan&&!S.plan.on?PL[S.plan.i]:null,e=!S.cart.length&&!pl;return `<h1>Your cart</h1>${S.cart.map((c,i)=>`<div class="card row sp"><div class="row"><div class="tile" style="width:52px;height:52px;font-size:26px">${M[c.id].e}</div><div><b>${M[c.id].n}</b><p class="mut">${c.sz} · ${M[c.id].k*c.q} kcal</p></div></div><div style="text-align:right"><b>${$(up(c)*c.q)}</b><div class="qty"><button onclick="q(${i},-1)">−</button>${c.q}<button onclick="q(${i},1)">+</button></div></div></div>`).join('')}
${pl?`<div class="card row sp"><div><b>📅 ${pl.n} plan</b><p class="mut">${pl.m} meals/week</p></div><b>${$(pl.$)}</b></div>`:''}
${e?`<div class="card" style="text-align:center"><div style="font-size:40px">🛒</div><b>Your cart is empty</b><p class="mut">Add a verified meal or start a weekly plan.</p><button class="btn sm" onclick="go('home')">Browse meals</button></div>`:`<h2>Delivery address</h2>${addrCard()}<h2>Delivery time</h2><div class="chips">${['12:00–1:00 PM','6:00–7:00 PM','7:00–8:00 PM'].map(x=>`<button class="chip ${S.slot==x?'on':''}" onclick="S.slot='${x}';draw()">${x}</button>`).join('')}</div>
<h2>Payment method</h2><div class="chips">${PY.map(x=>`<button class="chip ${S.pay==x[0]?'on':''}" onclick="S.pay='${x[0]}';draw()">${x[1]} ${x[0]}</button>`).join('')}</div>${S.pay=='Cash on delivery'?'<p class="mut">Please prepare the exact amount for the rider.</p>':''}<div class="card"><div class="row sp"><span class="mut">Subtotal</span><span>${$(t)}</span></div><div class="row sp"><span class="mut">Delivery fee</span><span>${$(29)}</span></div><div class="row sp" style="margin-top:6px"><b>Total</b><b style="font-size:18px">${$(t+29)}</b></div></div><button class="btn" onclick="place()">Place order · ${$(t+29)}</button><p class="mut" style="text-align:center;margin-top:8px">You can cancel before the vendor starts preparing.</p>`}`},
orders(){const o=S.ord;if(!o)return `<h1>Your orders</h1><div class="card" style="text-align:center"><div style="font-size:40px">📦</div><b>No orders yet</b><p class="mut">Your active orders will be tracked here.</p><button class="btn sm" onclick="go('home')">Find a meal</button></div>`;
if(o.x)return `<h1>Order cancelled</h1><div class="card"><b>#${o.id}</b><p class="mut">No charge was made.</p></div><button class="btn" onclick="S.cart=o.it.slice();go('cart')">Order again</button>`;
const st=['Order confirmed','Vendor is preparing your meal','Out for delivery','Delivered'];return `<h1>Order #${o.id}</h1><p class="mut">${o.step<3?'Arriving '+o.slot:'Enjoy your meal!'} · ${$(o.t)}</p><div class="card">${st.map((x,i)=>`<div class="step ${i==o.step?'cur':''}"><span class="dot ${i<=o.step?'done':''}"></span>${x}</div>`).join('')}</div>
<div class="card"><p class="mut">Delivering to</p><b>📍 ${E(S.addr.n)}</b><p class="mut">${E(S.addr.s)}, ${E(S.addr.c)}</p><p class="mut">Payment: ${o.pay}${o.pay=='Cash on delivery'?' · '+$(o.t)+' due on delivery':' · paid'}</p></div><button class="btn" style="margin-bottom:10px" onclick="chat()">💬 Chat about delivery</button>
${o.step<2?`<button class="btn red" onclick="if(S.cc){S.ord.x=1;draw();tst('Order cancelled')}else{S.cc=1;draw()}">${S.cc?'Tap again to confirm cancel':'Cancel order'}</button>`:`<p class="mut" style="text-align:center">Cancellation closes once preparation starts.</p>`}
<div style="margin-top:10px"><button class="btn ghost" onclick="S.cart=o.it.slice();go('cart')">Reorder these meals</button></div>`}};
function tg(j){const p=S.plan,P=PL[p.i];if(!p.d[j]&&p.d.filter(Boolean).length>=P.m)return tst('Your plan includes '+P.m+' meals a week');p.d[j]=!p.d[j];draw()}
function draw(){document.getElementById('app').innerHTML=`<div class="bar"><span class="brand">🥗 Conscious Kain</span><button class="chip" onclick="notes()">ⓘ Design notes</button></div>`+V[S.s]();const n=S.cart.reduce((a,c)=>a+c.q,0)+(S.plan&&!S.plan.on?1:0);
document.getElementById('nav').innerHTML=[['home','🏠','Home'],['plans','📅','Plans'],['cart','🛒','Cart'+(n?' ('+n+')':'')],['orders','📦','Orders']].map(x=>`<button class="${S.s==x[0]||(S.s=='detail'&&x[0]=='home')?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
draw();
</script></body></html>
